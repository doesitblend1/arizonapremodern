<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament Standings - Premodern</title>
  <style>
    body {
      background-color: #121212;
      color: #d4b58e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: #e6c8a0;
      font-size: 24px;
      margin-bottom: 20px;
    }
    #round-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .round-btn {
      background: rgba(44, 34, 30, 0.6);
      color: #d4b58e;
      border: 1px solid #4a3b2c;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .round-btn.active {
      background: #d4b58e;
      color: #2c221e;
      border-color: #d4b58e;
      font-weight: bold;
    }
    .table-wrapper {
      overflow-x: auto;
      background-color: rgba(0, 0, 0, 0.3);
      border: 1px solid #4a3b2c;
      border-radius: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
      white-space: nowrap;
    }
    th {
      background-color: rgba(74, 59, 44, 0.3);
      color: #e6c8a0;
      padding: 12px 16px;
      border-bottom: 1px solid #4a3b2c;
      font-weight: 600;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(74, 59, 44, 0.2);
    }
    tr:hover td {
      background-color: rgba(212, 181, 142, 0.03);
    }
    .points-cell {
      font-weight: bold;
      color: #e6c8a0;
    }
    .deck-link {
      color: #e6c8a0;
      text-decoration: underline;
      cursor: pointer;
    }
    .deck-link:hover {
      color: #fff;
    }
    /* Modal Popup Styling */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(2px);
      align-items: center;
      justify-content: center;
    }
    .modal.open {
      display: flex;
    }
    .modal-content {
      background-color: #1a1614;
      border: 1px solid #4a3b2c;
      border-radius: 8px;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      position: relative;
    }
    .close-modal {
      position: absolute;
      top: 16px;
      right: 20px;
      color: #d4b58e;
      font-size: 20px;
      cursor: pointer;
      background: none;
      border: none;
    }
    .close-modal:hover {
      color: #fff;
    }
    .modal-content h3 {
      margin-top: 0;
      color: #e6c8a0;
      font-size: 18px;
      border-bottom: 1px solid #4a3b2c;
      padding-bottom: 10px;
    }
    .modal-info {
      margin: 6px 0;
      font-size: 14px;
    }
    .decklist-section {
      margin-top: 15px;
      font-size: 13px;
    }
    .decklist-section h4 {
      color: #e6c8a0;
      margin: 10px 0 5px 0;
      border-bottom: 1px dashed #4a3b2c;
      padding-bottom: 4px;
    }
    .decklist-section ul {
      margin: 0;
      padding-left: 20px;
    }
    .loading-state, .error-state {
      padding: 40px;
      text-align: center;
      color: #e6c8a0;
    }
    .error-state {
      color: #e57373;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Tournament Standings</h1>
  
  <div id="round-buttons"></div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Player</th>
          <th>Decklist</th>
          <th>Match Record</th>
          <th>Game Record</th>
          <th>Points</th>
          <th>OMW%</th>
          <th>TGW%</th>
          <th>OGW%</th>
        </tr>
      </thead>
      <tbody id="standings-tbody">
        <tr>
          <td colspan="9" class="loading-state">Loading standings...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Deck Details Modal -->
<div id="deck-modal" class="modal">
  <div class="modal-content">
    <button class="close-modal" id="modal-close">&times;</button>
    <h3 id="modal-deck-title">Deck Details</h3>
    <div class="modal-info"><strong>Player:</strong> <span id="modal-player-name">--</span></div>
    <div class="modal-info"><strong>Archetype:</strong> <span id="modal-deck-name">--</span></div>
    
    <div id="decklist-container">
      <!-- Cards dynamically injected here -->
    </div>
  </div>
</div>

<script>
async function loadTournamentData() {
  try {
    // Load both JSON files concurrently
    const [standingsRes, decklistsRes] = await Promise.all([
      fetch('Standings-tournament-441561.json'),
      fetch('decklists-export-20260911_234215.json')
    ]);

    if (!standingsRes.ok || !decklistsRes.ok) throw new Error('Failed to load JSON datasets');
    
    const standingsData = await standingsRes.json();
    const decklistsData = await decklistsRes.json();

    // Map decklists by PlayerId for fast lookup
    const decklistsMap = {};
    decklistsData.forEach(deck => {
      decklistsMap[deck.PlayerId] = deck;
    });

    const roundsMap = {};
    const roundOrder = [];

    standingsData.forEach(item => {
      const roundKey = item.Round || `Round ${item.RoundNumber}`;
      if (!roundsMap[roundKey]) {
        roundsMap[roundKey] = [];
        roundOrder.push({ key: roundKey, phaseSort: item.PhaseSortOrder, roundNum: item.RoundNumber });
      }
      roundsMap[roundKey].push(item);
    });

    roundOrder.sort((a, b) => {
      if (a.phaseSort !== b.phaseSort) return a.phaseSort - b.phaseSort;
      return a.roundNum - b.roundNum;
    });

    const uniqueRounds = roundOrder.map(r => r.key);
    let activeRound = uniqueRounds[uniqueRounds.length - 1];

    const buttonsContainer = document.getElementById('round-buttons');
    const tbody = document.getElementById('standings-tbody');
    const modal = document.getElementById('deck-modal');
    const modalClose = document.getElementById('modal-close');
    
    const modalPlayer = document.getElementById('modal-player-name');
    const modalDeck = document.getElementById('modal-deck-name');
    const decklistContainer = document.getElementById('decklist-container');

    modalClose.addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('open');
    });

    function renderTable(roundKey) {
      const standings = roundsMap[roundKey] || [];
      standings.sort((a, b) => a.Rank - b.Rank);

      if (standings.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="loading-state">No data available for this round.</td></tr>`;
        return;
      }

      tbody.innerHTML = standings.map(row => {
        const playerObj = row.Team && row.Team.Players && row.Team.Players[0] ? row.Team.Players[0] : null;
        const playerName = playerObj ? playerObj.DisplayName : 'Unknown';
        const playerId = playerObj ? playerObj.ID : null;
          
        const deckObj = row.Decklists && row.Decklists[0] ? row.Decklists[0] : null;
        const deckName = deckObj ? deckObj.DecklistName : '-';

        const deckHtml = deckName !== '-' 
          ? `<span class="deck-link" data-player-id="${playerId}">${deckName}</span>` 
          : '-';

        return `
          <tr>
            <td>${row.Rank}</td>
            <td>${playerName}</td>
            <td>${deckHtml}</td>
            <td>${row.MatchRecord}</td>
            <td>${row.GameRecord}</td>
            <td class="points-cell">${row.Points}</td>
            <td>${(row.OpponentMatchWinPercentage * 100).toFixed(2)}%</td>
            <td>${(row.TeamGameWinPercentage * 100).toFixed(2)}%</td>
            <td>${(row.OpponentGameWinPercentage * 100).toFixed(2)}%</td>
          </tr>
        `;
      }).join('');

      // Bind click events to open decklist modal
      tbody.querySelectorAll('.deck-link').forEach(link => {
        link.addEventListener('click', (e) => {
          const playerId = parseInt(e.target.getAttribute('data-player-id'), 10);
          const deckData = decklistsMap[playerId];

          if (!deckData) {
            modalPlayer.innerText = 'Unknown';
            modalDeck.innerText = e.target.innerText;
            decklistContainer.innerHTML = `<p style="color: #e57373; margin-top: 15px;">Detailed decklist not found in export data.</p>`;
          } else {
            modalPlayer.innerText = deckData.OwnerNameFirstLast;
            modalDeck.innerText = deckData.DecklistName;

            // Separate Mainboard (c === 0) and Sideboard (c === 99)
            const mainboard = [];
            const sideboard = [];

            deckData.Records.forEach(record => {
              const cardEntry = `${record.q}x ${record.n}`;
              if (record.c === 99) {
                sideboard.push(cardEntry);
              } else {
                mainboard.push(cardEntry);
              }
            });

            decklistContainer.innerHTML = `
              <div class="decklist-section">
                <h4>Mainboard (${mainboard.reduce((sum, r) => sum + parseInt(r), 0)} cards)</h4>
                <ul>${mainboard.map(card => `<li>${card}</li>`).join('')}</ul>
              </div>
              ${sideboard.length > 0 ? `
                <div class="decklist-section">
                  <h4>Sideboard</h4>
                  <ul>${sideboard.map(card => `<li>${card}</li>`).join('')}</ul>
                </div>
              ` : ''}
            `;
          }

          modal.classList.add('open');
        });
      });
    }

    function renderButtons() {
      buttonsContainer.innerHTML = uniqueRounds.map(roundKey => {
        const isActive = roundKey === activeRound;
        return `<button class="round-btn ${isActive ? 'active' : ''}" data-round="${roundKey}">${roundKey}</button>`;
      }).join('');

      buttonsContainer.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', (e) => {
          activeRound = e.target.getAttribute('data-round');
          renderButtons();
          renderTable(activeRound);
        });
      });
    }

    renderButtons();
    renderTable(activeRound);

  } catch (error) {
    console.error('Error loading tournament data:', error);
    document.getElementById('standings-tbody').innerHTML = `<tr><td colspan="9" class="error-state">Failed to load tournament data. Ensure both JSON files are in the root directory and running via a local server.</td></tr>`;
  }
}

loadTournamentData();
</script>

</body>
</html>
