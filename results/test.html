<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Optimization Meta Tags -->
    <title>Tournament Standings - Phoenix, Arizona Premodern Magic the Gathering</title>
    <meta name="description" content="View past tournament standings and decklists for the Arizona Premodern Magic the Gathering community.">
    <meta name="keywords" content="Premodern Magic, Standings, Decklists, Phoenix AZ, MTG, Premodern MTG">
    <meta name="author" content="Phoenix Premodern Community">
    
    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="Tournament Standings - Arizona Premodern MTG">
    <meta property="og:description" content="Browse tournament standings and player decklists for Phoenix Premodern Magic the Gathering.">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for an earthy, premodern theme feel */
        ::-webkit-scrollbar {
            width: 8px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #2a231d; 
        }
        ::-webkit-scrollbar-thumb {
            background: #5c4e3d; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #dcb773; 
        }
        body {
            background-color: #1a1612;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="text-[#e0d6c8] font-serif antialiased leading-relaxed min-h-screen flex flex-col justify-between relative">

    <!-- Header / Hero Section -->
    <header class="bg-[#2a231d] border-b-8 border-[#8c734a] relative overflow-hidden flex items-center justify-center">
        
        <!-- Image Layer (References parent directory assets) -->
        <div class="w-full flex justify-between items-center md:absolute md:inset-0 z-0">
            <img src="../torleft.gif" alt="Header Art Left" class="w-1/2 md:w-auto h-auto md:h-full object-contain object-left pointer-events-none opacity-40 md:opacity-100">
            <img src="../orbright.gif" alt="Header Art Right" class="w-1/2 md:w-auto h-auto md:h-full object-contain object-right pointer-events-none opacity-40 md:opacity-100">
        </div>
        
        <!-- Text Layer -->
        <div class="absolute md:relative inset-0 md:inset-auto flex flex-col items-center justify-center px-2 z-10 w-full md:py-16">
            <h1 class="text-[clamp(1.75rem,7vw,4rem)] md:text-7xl lg:text-8xl font-bold text-[#dcb773] tracking-wider mb-1 md:mb-4 drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] uppercase leading-tight text-center">
                Arizona Premodern
            </h1>
            <p class="text-[clamp(0.65rem,2.8vw,1.25rem)] md:text-2xl text-[#bdae93] italic drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] text-center">
                Tournament Standings & Decklist Archive
            </p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 md:px-6 py-8 md:py-12 w-full flex-grow">

        <!-- Back to Home Link -->
        <div class="mb-6">
            <a href="../" class="inline-flex items-center gap-2 text-[#dcb773] hover:text-[#f2ce8a] text-sm md:text-base font-bold transition-colors">
                &#10094; Back to Home
            </a>
        </div>

        <!-- Tournament Month/Year Navigation Bar -->
        <div class="mb-4 bg-[#2a231d] p-4 rounded-sm border border-[#5c4e3d] shadow-md">
            <div class="text-xs text-[#bdae93] font-bold uppercase tracking-wider mb-2">Tournament:</div>
            <div id="tournament-nav" class="flex gap-2 overflow-x-auto pb-2 items-center scrollbar-thin">
                <!-- Dynamically populated tournament buttons -->
            </div>
        </div>

        <!-- Round Selector Buttons -->
        <div class="mb-6 bg-[#2a231d]/60 p-3 rounded-sm border border-[#5c4e3d]/50">
            <div class="text-xs text-[#bdae93] font-bold uppercase tracking-wider mb-2">Select Round:</div>
            <div id="round-buttons" class="flex gap-2 overflow-x-auto pb-2 scrollbar-thin">
                <!-- Dynamically populated round buttons -->
            </div>
        </div>

        <!-- Standings Table Container -->
        <div class="bg-[#2a231d] rounded-sm border-2 border-[#8c734a] shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full border-collapse text-left text-sm md:text-base whitespace-nowrap">
                    <thead>
                        <tr class="bg-[#3b3228] border-b border-[#5c4e3d] text-[#e6c8a0]">
                            <th class="p-3 md:p-4 font-bold">Rank</th>
                            <th class="p-3 md:p-4 font-bold">Player</th>
                            <th class="p-3 md:p-4 font-bold">Decklist</th>
                            <th class="p-3 md:p-4 font-bold">Match Record</th>
                            <th class="p-3 md:p-4 font-bold">Game Record</th>
                            <th class="p-3 md:p-4 font-bold">Points</th>
                            <th class="p-3 md:p-4 font-bold">OMW%</th>
                            <th class="p-3 md:p-4 font-bold">TGW%</th>
                            <th class="p-3 md:p-4 font-bold">OGW%</th>
                        </tr>
                    </thead>
                    <tbody id="standings-tbody" class="divide-y divide-[#5c4e3d]/40">
                        <tr>
                            <td colspan="9" class="p-8 text-center text-[#e6c8a0]">Loading tournaments...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-[#1a1612] py-6 md:py-8 text-center border-t-4 border-[#8c734a] mt-8 md:mt-12 relative overflow-hidden px-4">
        <div class="absolute inset-0 opacity-10" style="background-image: url('data:image/svg+xml,%3Csvg width=\'100\' height=\'100\' viewBox=\'0 0 100 100\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noise\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.8\' numOctaves=\'4\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100\' height=\'100\' filter=\'url(%23noise)\' opacity=\'0.08\'/%3E%3C/svg%3E');"></div>
        <div class="relative z-10">
            <p class="text-[#bdae93] text-xs md:text-sm tracking-wide font-bold">
                © 2026 Arizona Premodern. All Rights Reserved.
            </p>
        </div>
    </footer>

    <!-- Deck Details Modal Popup -->
    <div id="deck-modal" class="fixed inset-0 bg-black/80 z-[50] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#2a231d] border-2 border-[#8c734a] rounded-sm p-6 w-full max-w-lg max-h-[85vh] overflow-y-auto shadow-2xl relative text-[#e0d6c8]">
            <button id="modal-close" class="absolute top-4 right-4 text-[#dcb773] hover:text-white text-2xl font-bold cursor-pointer">&times;</button>
            <h3 class="text-xl font-bold text-[#dcb773] mb-4 border-b border-[#5c4e3d] pb-2 uppercase tracking-wide">Deck Details</h3>
            
            <div class="space-y-2 mb-4 text-sm md:text-base">
                <p><strong>Player:</strong> <span id="modal-player-name" class="text-[#e6c8a0]">--</span></p>
                <p><strong>Archetype:</strong> <span id="modal-deck-name" class="text-[#e6c8a0]">--</span></p>
            </div>

            <!-- Export / Copy Buttons -->
            <div class="flex gap-2 mb-4">
                <button id="copy-deck-btn" class="bg-[#3b3228] text-[#dcb773] border border-[#5c4e3d] hover:bg-[#8c734a] hover:text-[#1a1612] px-3 py-1.5 rounded-sm text-sm font-bold transition-colors cursor-pointer flex-1">
                    Copy Decklist
                </button>
                <button id="export-deck-btn" class="bg-[#3b3228] text-[#dcb773] border border-[#5c4e3d] hover:bg-[#8c734a] hover:text-[#1a1612] px-3 py-1.5 rounded-sm text-sm font-bold transition-colors cursor-pointer flex-1">
                    Export .txt
                </button>
            </div>
            
            <div id="decklist-container" class="space-y-4 text-sm">
                <!-- Cards injected here -->
            </div>
        </div>
    </div>

    <!-- Centered Card Preview Modal (Replaces Tooltip) -->
    <div id="card-preview-modal" class="fixed inset-0 bg-black/70 z-[60] hidden items-center justify-center p-4 backdrop-blur-md">
        <div class="relative w-64 md:w-72 bg-[#1a1612] border-2 border-[#8c734a] rounded-sm shadow-2xl flex flex-col overflow-hidden text-[#e0d6c8] max-h-[90vh]">
            
            <!-- Explicit Close Button -->
            <button id="card-preview-close" class="absolute top-2 right-2 bg-black/60 hover:bg-black text-white rounded-full w-8 h-8 flex items-center justify-center text-xl font-bold z-10 cursor-pointer transition-colors border border-white/20">
                &times;
            </button>

            <!-- Card Image -->
            <img id="preview-img" class="w-full h-auto relative z-0 shrink-0" src="" alt="Card Preview">
            
            <!-- Oracle Text Container -->
            <div id="preview-oracle-container" class="p-4 text-xs md:text-sm bg-[#2a231d] hidden flex-col gap-2 relative z-0 overflow-y-auto">
                <div class="flex justify-between font-bold text-[#dcb773] text-sm md:text-base">
                    <span id="preview-name"></span>
                    <span id="preview-mana" class="whitespace-nowrap ml-2"></span>
                </div>
                <div id="preview-type" class="italic text-[#bdae93] border-b border-[#5c4e3d] pb-2 mb-1"></div>
                <div id="preview-text" class="whitespace-pre-wrap leading-relaxed text-[#e0d6c8]"></div>
            </div>
        </div>
    </div>

    <!-- Standings & Modal Script -->
    <script>
        let cardDatabase = {};

        async function initApp() {
          try {
            // Fetch local card library
            try {
                const dbRes = await fetch('premodern-cards.json');
                if (dbRes.ok) {
                    cardDatabase = await dbRes.json();
                } else {
                    console.error("Failed to load premodern-cards.json");
                }
            } catch (err) {
                console.error("Local card database fetch error:", err);
            }

            const manifestRes = await fetch('tournaments.json');
            if (!manifestRes.ok) throw new Error('Failed to load tournaments.json manifest');
            
            let tournaments = await manifestRes.json();
            tournaments.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (tournaments.length === 0) {
              document.getElementById('standings-tbody').innerHTML = `<tr><td colspan="9" class="p-8 text-center text-[#e57373]">No tournaments found in manifest.</td></tr>`;
              return;
            }

            let activeTournament = tournaments[0];

            const tournamentNav = document.getElementById('tournament-nav');
            const roundButtonsContainer = document.getElementById('round-buttons');
            const tbody = document.getElementById('standings-tbody');
            
            // Deck Modal Elements
            const deckModal = document.getElementById('deck-modal');
            const deckModalClose = document.getElementById('modal-close');
            const modalPlayer = document.getElementById('modal-player-name');
            const modalDeck = document.getElementById('modal-deck-name');
            const decklistContainer = document.getElementById('decklist-container');
            
            // Card Preview Modal Elements
            const cardPreviewModal = document.getElementById('card-preview-modal');
            const cardPreviewCloseBtn = document.getElementById('card-preview-close');
            const previewImg = document.getElementById('preview-img');
            const previewOracleContainer = document.getElementById('preview-oracle-container');
            const previewName = document.getElementById('preview-name');
            const previewMana = document.getElementById('preview-mana');
            const previewType = document.getElementById('preview-type');
            const previewText = document.getElementById('preview-text');

            let currentDeckText = "";
            let currentDeckFilename = "";
            const copyBtn = document.getElementById('copy-deck-btn');
            const exportBtn = document.getElementById('export-deck-btn');

            // --- DECK MODAL LOGIC ---
            const closeDeckModal = () => {
              deckModal.classList.remove('flex', 'open');
              deckModal.classList.add('hidden');
            };

            deckModalClose.addEventListener('click', closeDeckModal);
            deckModal.addEventListener('click', (e) => {
              // Only close if clicking the dark background, not the content
              if (e.target === deckModal) closeDeckModal();
            });

            // --- CARD PREVIEW MODAL LOGIC ---
            const closeCardPreview = () => {
              cardPreviewModal.classList.remove('flex');
              cardPreviewModal.classList.add('hidden');
            };

            cardPreviewCloseBtn.addEventListener('click', closeCardPreview);
            cardPreviewModal.addEventListener('click', (e) => {
              // Only close if clicking the dark background outside the card
              if (e.target === cardPreviewModal) closeCardPreview();
            });

            function populateCardPreview(cardName) {
                const cardData = cardDatabase[cardName];
                if (cardData) {
                    previewImg.src = cardData.image;
                    previewImg.classList.remove('hidden');
                    
                    if (cardData.oracle_text || cardData.type_line) {
                        previewName.innerText = cardName;
                        previewMana.innerText = cardData.mana_cost || '';
                        previewType.innerText = cardData.type_line || '';
                        previewText.innerText = cardData.oracle_text || '';
                        previewOracleContainer.classList.remove('hidden');
                        previewOracleContainer.classList.add('flex');
                    } else {
                        previewOracleContainer.classList.add('hidden');
                        previewOracleContainer.classList.remove('flex');
                    }
                } else {
                    // Fallback to scryfall if a card name isn't found in JSON
                    previewImg.src = `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(cardName)}&format=image&version=normal`;
                    previewImg.classList.remove('hidden');
                    previewOracleContainer.classList.add('hidden');
                    previewOracleContainer.classList.remove('flex');
                }
            }

            // Copy Button Logic
            copyBtn.addEventListener('click', async () => {
                if (!currentDeckText) return;
                try {
                    await navigator.clipboard.writeText(currentDeckText);
                    copyBtn.innerText = 'Copied!';
                    copyBtn.classList.add('bg-[#8c734a]', 'text-[#1a1612]');
                    setTimeout(() => {
                        copyBtn.innerText = 'Copy Decklist';
                        copyBtn.classList.remove('bg-[#8c734a]', 'text-[#1a1612]');
                    }, 2000);
                } catch (err) {
                    console.error('Failed to copy text: ', err);
                }
            });

            // Export Button Logic
            exportBtn.addEventListener('click', () => {
                if (!currentDeckText) return;
                const blob = new Blob([currentDeckText], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = currentDeckFilename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });

            function formatMonthYear(dateString) {
              const d = new Date(dateString);
              return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            }

            async function loadTournament(tournament) {
              tbody.innerHTML = `<tr><td colspan="9" class="p-8 text-center text-[#e6c8a0]">Loading tournament data...</td></tr>`;

              try {
                const [standingsRes, decklistsRes] = await Promise.all([
                  fetch(tournament.standingsFile),
                  fetch(tournament.decklistsFile)
                ]);

                if (!standingsRes.ok || !decklistsRes.ok) throw new Error('Failed to load tournament files');

                const standingsData = await standingsRes.json();
                const decklistsData = await decklistsRes.json();

                const decklistsMap = {};
                decklistsData.forEach(deck => {
                  decklistsMap[deck.PlayerId] = deck;
                });

                const roundsMap = {};
                const roundOrder = [];

                standingsData.forEach(item => {
                  const roundKey = item.Round || `Round ${item.RoundNumber}`;
                  if (!roundsMap[roundKey]) {
                    roundsMap[roundKey] = [];
                    roundOrder.push({ key: roundKey, phaseSort: item.PhaseSortOrder, roundNum: item.RoundNumber });
                  }
                  roundsMap[roundKey].push(item);
                });

                roundOrder.sort((a, b) => {
                  if (a.phaseSort !== b.phaseSort) return a.phaseSort - b.phaseSort;
                  return a.roundNum - b.roundNum;
                });

                const uniqueRounds = roundOrder.map(r => r.key).reverse();
                let activeRound = uniqueRounds[0]; 

                function renderTable(roundKey) {
                  const standings = roundsMap[roundKey] || [];
                  standings.sort((a, b) => a.Rank - b.Rank);

                  if (standings.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="9" class="p-8 text-center text-[#e6c8a0]">No data available for this round.</td></tr>`;
                    return;
                  }

                  tbody.innerHTML = standings.map(row => {
                    const playerObj = row.Team && row.Team.Players && row.Team.Players[0] ? row.Team.Players[0] : null;
                    const playerName = playerObj ? playerObj.DisplayName : 'Unknown';
                    const playerId = playerObj ? playerObj.ID : null;
                      
                    const deckObj = row.Decklists && row.Decklists[0] ? row.Decklists[0] : null;
                    const deckName = deckObj ? deckObj.DecklistName : '-';

                    const deckHtml = deckName !== '-' 
                      ? `<span class="text-[#dcb773] hover:text-white underline cursor-pointer font-bold deck-link" data-player-id="${playerId}" data-deck-name="${deckName}">${deckName}</span>` 
                      : '-';

                    return `
                      <tr class="hover:bg-[#3b3228]/50 transition-colors">
                        <td class="p-3 md:p-4 text-[#e6c8a0] font-bold">${row.Rank}</td>
                        <td class="p-3 md:p-4">${playerName}</td>
                        <td class="p-3 md:p-4">${deckHtml}</td>
                        <td class="p-3 md:p-4">${row.MatchRecord}</td>
                        <td class="p-3 md:p-4">${row.GameRecord}</td>
                        <td class="p-3 md:p-4 font-bold text-[#e6c8a0]">${row.Points}</td>
                        <td class="p-3 md:p-4">${(row.OpponentMatchWinPercentage * 100).toFixed(2)}%</td>
                        <td class="p-3 md:p-4">${(row.TeamGameWinPercentage * 100).toFixed(2)}%</td>
                        <td class="p-3 md:p-4">${(row.OpponentGameWinPercentage * 100).toFixed(2)}%</td>
                      </tr>
                    `;
                  }).join('');

                  tbody.querySelectorAll('.deck-link').forEach(link => {
                    link.addEventListener('click', (e) => {
                      const playerId = parseInt(e.target.getAttribute('data-player-id'), 10);
                      const cleanDeckName = e.target.getAttribute('data-deck-name');
                      const deckData = decklistsMap[playerId];
                      const resolvedPlayerName = deckData ? deckData.OwnerNameFirstLast : e.target.closest('tr').cells[1].innerText;

                      modalPlayer.innerText = resolvedPlayerName;
                      modalDeck.innerText = cleanDeckName;

                      if (!deckData || !deckData.Records) {
                        decklistContainer.innerHTML = `<p class="text-[#e57373]">Detailed decklist cards not found in export data.</p>`;
                        currentDeckText = "";
                        copyBtn.style.display = 'none';
                        exportBtn.style.display = 'none';
                      } else {
                        copyBtn.style.display = 'block';
                        exportBtn.style.display = 'block';
                        
                        const mainboardHtml = [];
                        const sideboardHtml = [];
                        
                        const plainTextMain = [];
                        const plainTextSide = [];

                        deckData.Records.forEach(record => {
                          const safeName = record.n.replace(/"/g, '&quot;');
                          // We still keep the link styling, but it will now trigger a click everywhere
                          const htmlEntry = `${record.q}x <span class="card-name-link text-[#dcb773] hover:text-white cursor-pointer underline decoration-dotted underline-offset-2 transition-colors" data-card-name="${safeName}">${record.n}</span>`;
                          const plainEntry = `${record.q} ${record.n}`;
                          
                          if (record.c === 99) {
                            sideboardHtml.push(htmlEntry);
                            plainTextSide.push(plainEntry);
                          } else {
                            mainboardHtml.push(htmlEntry);
                            plainTextMain.push(plainEntry);
                          }
                        });

                        currentDeckText = plainTextMain.join('\n');
                        if (plainTextSide.length > 0) {
                            currentDeckText += '\n\nSideboard\n' + plainTextSide.join('\n');
                        }

                        const safeFilenamePlayer = resolvedPlayerName.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                        const safeFilenameDeck = cleanDeckName.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                        currentDeckFilename = `${safeFilenamePlayer}_${safeFilenameDeck}.txt`;

                        decklistContainer.innerHTML = `
                          <div class="border-t border-[#5c4e3d] pt-3">
                            <h4 class="font-bold text-[#dcb773] uppercase tracking-wide mb-2 text-xs">Mainboard</h4>
                            <ul class="list-none space-y-1 text-[#bdae93]">${mainboardHtml.map(card => `<li>${card}</li>`).join('')}</ul>
                          </div>
                          ${sideboardHtml.length > 0 ? `
                            <div class="border-t border-[#5c4e3d] pt-3 mt-3">
                              <h4 class="font-bold text-[#dcb773] uppercase tracking-wide mb-2 text-xs">Sideboard</h4>
                              <ul class="list-none space-y-1 text-[#bdae93]">${sideboardHtml.map(card => `<li>${card}</li>`).join('')}</ul>
                            </div>
                          ` : ''}
                        `;
                        
                        // Unified Click Event for Cards (Desktop & Mobile)
                        decklistContainer.querySelectorAll('.card-name-link').forEach(cardLink => {
                          cardLink.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const cardName = e.target.getAttribute('data-card-name');
                            populateCardPreview(cardName);
                            
                            // Show the card preview modal on top of the deck modal
                            cardPreviewModal.classList.remove('hidden');
                            cardPreviewModal.classList.add('flex');
                          });
                        });
                      }

                      deckModal.classList.remove('hidden');
                      deckModal.classList.add('flex', 'open');
                    });
                  });
                }

                function renderRoundsNav() {
                  roundButtonsContainer.innerHTML = uniqueRounds.map(roundKey => {
                    const isActive = roundKey === activeRound;
                    const btnClass = isActive 
                      ? 'bg-[#dcb773] text-[#1a1612] border-[#dcb773] font-bold shadow-md' 
                      : 'bg-[#3b3228] text-[#dcb773] border-[#5c4e3d] hover:bg-[#8c734a] hover:text-[#1a1612]';
                    return `<button class="round-btn px-4 py-2 rounded-sm border text-sm transition-colors cursor-pointer whitespace-nowrap shrink-0 ${btnClass}" data-round="${roundKey}">${roundKey}</button>`;
                  }).join('');

                  roundButtonsContainer.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                      activeRound = e.target.getAttribute('data-round');
                      renderRoundsNav();
                      renderTable(activeRound);
                    });
                  });
                }

                renderRoundsNav();
                renderTable(activeRound);

              } catch (err) {
                console.error('Error loading tournament files:', err);
                tbody.innerHTML = `<tr><td colspan="9" class="p-8 text-center text-[#e57373]">Failed to load tournament files. Check file paths in tournaments.json.</td></tr>`;
              }
            }

            function renderTournamentNav() {
              tournamentNav.innerHTML = tournaments.map(t => {
                const isActive = t === activeTournament;
                const label = formatMonthYear(t.date);
                const btnClass = isActive 
                  ? 'bg-[#dcb773] text-[#1a1612] border-[#dcb773] font-bold shadow-md' 
                  : 'bg-[#3b3228] text-[#dcb773] border-[#5c4e3d] hover:bg-[#8c734a] hover:text-[#1a1612]';
                return `<button class="tournament-btn px-4 py-2 rounded-sm border text-sm transition-colors cursor-pointer whitespace-nowrap shrink-0 ${btnClass}" data-date="${t.date}">${label}</button>`;
              }).join('');

              tournamentNav.querySelectorAll('.tournament-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                  const selectedDate = e.target.getAttribute('data-date');
                  activeTournament = tournaments.find(t => t.date === selectedDate);
                  renderTournamentNav();
                  loadTournament(activeTournament);
                });
              });
            }

            renderTournamentNav();
            loadTournament(activeTournament);

          } catch (error) {
            console.error('Error loading manifest:', error);
            document.getElementById('standings-tbody').innerHTML = `<tr><td colspan="9" class="p-8 text-center text-[#e57373]">Failed to load tournaments.json manifest file.</td></tr>`;
          }
        }

        initApp();
    </script>
</body>
</html>
